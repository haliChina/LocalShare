<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" overflow="hidden" role="img" aria-labelledby="t d"><title id="t">LocalShare trust and file boundary</title><desc id="d">All protected routes can use one shared Basic Auth credential, while the public health endpoint exposes service state and HTTP itself does not encrypt credentials or files.</desc><rect width="1200" height="490" rx="24" fill="#F2F8F8"/><path d="M0 112H1200M0 400H1200" stroke="#C4DADB"/><g font-family="Arial,Helvetica,sans-serif"><text x="58" y="51" fill="#0F766E" font-family="monospace" font-size="17">TRUST BOUNDARY / FILE BOUNDARY</text><text x="58" y="94" fill="#102A2D" font-size="36" font-weight="800">Designed for a trusted local network</text>
<g transform="translate(58 151)"><rect width="244" height="197" rx="15" fill="#FFFFFF" stroke="#C4DADB"/><text x="20" y="34" fill="#0F766E" font-family="monospace" font-size="15">LISTENER</text><text x="20" y="72" fill="#102A2D" font-size="22" font-weight="700">0.0.0.0 : PORT</text><text x="20" y="104" fill="#49666A" font-size="16">visible to reachable peers</text><text x="20" y="132" fill="#49666A" font-size="16">default port 3000</text><rect x="20" y="153" width="180" height="25" rx="12.5" fill="#FFF7ED"/><text x="110" y="170" text-anchor="middle" fill="#C2410C" font-family="monospace" font-size="12">AUTH OFF BY DEFAULT</text></g><path d="M313 250H363M353 241L363 250L353 259" fill="none" stroke="#5A777B" stroke-width="2.5"/>
<g transform="translate(374 151)"><rect width="250" height="197" rx="15" fill="#103035"/><text x="20" y="34" fill="#5EEAD4" font-family="monospace" font-size="15">EXPRESS ROUTES</text><text x="20" y="71" fill="#FFFFFF" font-size="20" font-weight="700">BROWSE / UPLOAD</text><text x="20" y="101" fill="#FFFFFF" font-size="20" font-weight="700">RAW / ZIP / PREVIEW</text><text x="20" y="136" fill="#B7D2D4" font-size="15">safe path checks</text><text x="20" y="164" fill="#B7D2D4" font-size="15">streamed I/O</text></g><path d="M635 250H685M675 241L685 250L675 259" fill="none" stroke="#5A777B" stroke-width="2.5"/>
<g transform="translate(696 151)"><rect width="210" height="197" rx="15" fill="#FFFFFF" stroke="#C4DADB"/><text x="20" y="34" fill="#0F766E" font-family="monospace" font-size="15">FILESYSTEM</text><text x="20" y="72" fill="#102A2D" font-size="22" font-weight="700">SHARED/</text><text x="20" y="105" fill="#49666A" font-size="16">persistent data</text><text x="20" y="133" fill="#49666A" font-size="16">next to executable</text><text x="20" y="161" fill="#49666A" font-size="16">5 GB / file cap</text></g>
<g transform="translate(938 151)"><rect width="204" height="197" rx="15" fill="#FFF7ED" stroke="#FDBA74"/><text x="20" y="34" fill="#C2410C" font-family="monospace" font-size="15">OPTIONAL BASIC AUTH</text><text x="20" y="72" fill="#431407" font-size="19" font-weight="700">one credential</text><text x="20" y="102" fill="#431407" font-size="19" font-weight="700">all users</text><text x="20" y="136" fill="#9A3412" font-size="15">HTTP is plaintext</text><text x="20" y="163" fill="#9A3412" font-size="15">healthz stays public</text></g><g transform="translate(58 442)" font-family="monospace" font-size="14"><circle cx="7" cy="-5" r="6" fill="#EA580C"/><text x="25" fill="#49666A">Use a firewall and trusted LAN. Put TLS at a reverse proxy before crossing an untrusted network.</text></g></g></svg>