<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" overflow="hidden" role="img" aria-labelledby="t d"><title id="t">LocalShare — LAN file sharing from one Windows executable</title><desc id="d">A host exposes a shared directory to browsers on the local network for browsing, uploading, previewing, and downloading files.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#071014"/></linearGradient><clipPath id="c"><rect width="1200" height="540" rx="28"/></clipPath></defs><g clip-path="url(#c)"><rect width="1200" height="540" fill="url(#bg)"/><circle cx="1115" cy="-60" r="250" fill="#14B8A6" opacity=".11"/><path d="M0 474H1200" stroke="#29434A"/>
<g transform="translate(64 62)" font-family="Arial,Helvetica,sans-serif"><rect width="254" height="36" rx="18" fill="#0F2F34" stroke="#2DD4BF"/><circle cx="20" cy="18" r="5" fill="#5EEAD4"/><text x="36" y="24" fill="#99F6E4" font-size="15" font-weight="700">LAN FILE SERVICE</text><text x="0" y="135" fill="#FFFFFF" font-size="68" font-weight="800">LocalShare</text><text x="0" y="191" fill="#5EEAD4" font-size="34" font-weight="700">ONE EXE · ONE FOLDER</text><text x="0" y="246" fill="#D1E4E6" font-size="22">Browse and transfer across your LAN.</text><text x="0" y="280" fill="#8BA7AA" font-size="19">No CDN. Streams large files to disk.</text><g transform="translate(0 327)" font-family="monospace" font-size="15"><rect width="179" height="42" rx="8" fill="#0C2026" stroke="#32606A"/><text x="21" y="27" fill="#CCFBF1">WINDOWS EXE</text><rect x="191" width="193" height="42" rx="8" fill="#0C2026" stroke="#32606A"/><text x="213" y="27" fill="#CCFBF1">OPTIONAL AUTH</text></g></g>
<g transform="translate(520 56)" font-family="Arial,Helvetica,sans-serif"><rect width="622" height="397" rx="22" fill="#0A141A" stroke="#32606A"/><text x="28" y="38" fill="#78969B" font-family="monospace" font-size="15">LOCAL NETWORK TOPOLOGY</text><g transform="translate(222 66)"><rect width="178" height="92" rx="14" fill="#12333A" stroke="#2DD4BF"/><rect x="20" y="20" width="45" height="38" rx="4" fill="none" stroke="#99F6E4" stroke-width="3"/><path d="M28 68H57" stroke="#99F6E4" stroke-width="3"/><text x="82" y="37" fill="#FFFFFF" font-size="20" font-weight="700">HOST</text><text x="82" y="62" fill="#91B4B7" font-family="monospace" font-size="13">:3000</text></g><path d="M311 158V198M311 198H106V229M311 198H516V229" fill="none" stroke="#3F6870" stroke-width="3" stroke-linecap="round"/><g transform="translate(28 229)"><rect width="218" height="112" rx="14" fill="#0E242B" stroke="#32606A"/><text x="20" y="31" fill="#5EEAD4" font-family="monospace" font-size="14">LAN CLIENT</text><text x="20" y="66" fill="#FFFFFF" font-size="21" font-weight="700">BROWSER</text><text x="20" y="93" fill="#8BA7AA" font-size="15">browse · upload · preview</text></g><g transform="translate(376 229)"><rect width="218" height="112" rx="14" fill="#0E242B" stroke="#32606A"/><text x="20" y="31" fill="#5EEAD4" font-family="monospace" font-size="14">PERSISTENT DATA</text><text x="20" y="66" fill="#FFFFFF" font-size="21" font-weight="700">SHARED/</text><text x="20" y="93" fill="#8BA7AA" font-size="15">files live beside the exe</text></g><g transform="translate(266 177)"><rect width="90" height="42" rx="21" fill="#172B20" stroke="#22C55E"/><text x="45" y="27" text-anchor="middle" fill="#86EFAC" font-family="monospace" font-size="13">STREAM</text></g><rect x="28" y="354" width="566" height="26" rx="13" fill="#281B17"/><text x="311" y="372" text-anchor="middle" fill="#FDBA74" font-family="monospace" font-size="13">DEFAULT: 0.0.0.0 + NO AUTH — TRUST YOUR LAN</text></g><g transform="translate(64 510)" fill="#78969B" font-family="monospace" font-size="15"><text>CLIENTS ↔ EXPRESS ↔ SAFE PATH ↔ SHARED DIRECTORY</text><text x="956">NODE 18</text></g></g></svg>